[project]
name = "bricscad-mcp"
version = "0.1.0"
description = "MCP server for controlling BricsCAD through a LISP bridge"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",
    "platformdirs>=4.2",
    "psutil>=6.0",
]

[project.scripts]
bricscad-mcp = "bricscad_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bricscad_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-m 'not bricscad'"
markers = [
    "bricscad: needs a real BricsCAD installation; run with -m bricscad",
]
